<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Pancasila – Kelas V SD</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--color-paper:oklch(.95 .035 235);--color-paper-2:oklch(.995 .008 235);--color-paper-3:oklch(.89 .06 240);
--color-ink:oklch(.24 .07 265);--color-ink-2:oklch(.38 .06 265);--color-muted:oklch(.45 .05 265);--color-rule:oklch(.8 .05 250);
--color-accent:oklch(.7 .2 27);--color-accent-ink:oklch(.2 .05 265);--color-focus:oklch(.5 .22 262);
--font-display:"Lilita One","Baloo 2",system-ui,sans-serif;--font-body:Nunito,system-ui,sans-serif;
--radius-card:26px;--radius-pill:99px;--shadow-card:0 6px 0 var(--color-rule);
--sky:oklch(.84 .09 235);--star:oklch(1 0 0/.95);
--c1:oklch(.85 .17 85);--c2:oklch(.7 .2 25);--c3:oklch(.76 .18 155);--c4:oklch(.72 .15 250);--c5:oklch(.74 .15 300);--c6:oklch(.42 .17 285);
--on:oklch(.22 .06 265);--ok:oklch(.4 .13 155);--okbg:oklch(.93 .06 155);--no:oklch(.45 .17 25);--nobg:oklch(.94 .045 25);
--bg:var(--color-paper);--card:var(--color-paper-2);--ink:var(--color-ink);--mut:var(--color-muted);--line:var(--color-rule)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--color-paper:oklch(.2 .06 268);--color-paper-2:oklch(.27 .07 268);--color-paper-3:oklch(.33 .08 268);
--color-ink:oklch(.96 .02 260);--color-ink-2:oklch(.86 .04 260);--color-muted:oklch(.76 .05 260);--color-rule:oklch(.4 .07 268);
--color-accent:oklch(.74 .19 27);--color-focus:oklch(.8 .14 250);--sky:oklch(.3 .11 275);--star:oklch(.95 .08 95/.9);
--ok:oklch(.82 .15 155);--okbg:oklch(.33 .07 155);--no:oklch(.84 .12 25);--nobg:oklch(.34 .09 25)}}
:root[data-theme="dark"]{
--color-paper:oklch(.2 .06 268);--color-paper-2:oklch(.27 .07 268);--color-paper-3:oklch(.33 .08 268);
--color-ink:oklch(.96 .02 260);--color-ink-2:oklch(.86 .04 260);--color-muted:oklch(.76 .05 260);--color-rule:oklch(.4 .07 268);
--color-accent:oklch(.74 .19 27);--color-focus:oklch(.8 .14 250);--sky:oklch(.3 .11 275);--star:oklch(.95 .08 95/.9);
--ok:oklch(.82 .15 155);--okbg:oklch(.33 .07 155);--no:oklch(.84 .12 25);--nobg:oklch(.34 .09 25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:700 17px/1.5 var(--font-body);background:linear-gradient(var(--sky),var(--bg) 75%) fixed;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 18% 28%,var(--star) 50%,#0000 52%),radial-gradient(1.5px 1.5px at 72% 12%,var(--star) 50%,#0000 52%),radial-gradient(2.5px 2.5px at 88% 58%,var(--star) 50%,#0000 52%),radial-gradient(1.5px 1.5px at 38% 82%,var(--star) 50%,#0000 52%),radial-gradient(2px 2px at 55% 48%,var(--star) 50%,#0000 52%);background-size:280px 280px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.8rem}
main{position:relative;max-width:640px;margin:0 auto;padding:14px 14px 40px}
p{margin:0 0 10px}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#tot,.mini{background:var(--card);border:3px solid var(--line);border-radius:var(--radius-pill);padding:4px 16px;font:800 .95rem var(--font-body);color:var(--ink)}
#tot:before{content:"★ ";color:var(--c1)}
.mini{cursor:pointer;box-shadow:0 3px 0 var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:22px;margin-bottom:22px}
.center{text-align:center}
.top[hidden]{display:none}
.intro{display:grid;grid-template-columns:auto 1fr;align-items:center;justify-content:center;gap:clamp(10px,3vw,22px);min-height:78vh;padding:0 4px}
.intro img{display:block;width:clamp(104px,31vw,210px);height:auto;filter:drop-shadow(0 0 3px oklch(1 0 0/.85)) drop-shadow(0 6px 0 var(--line))}
.intro h1{font:700 clamp(1.9rem,7.4vw,3.1rem)/1 Poppins,system-ui,sans-serif;letter-spacing:-.035em;color:var(--ink);margin:0}
.btn.start{display:inline-block;width:auto;min-height:0;margin-top:20px;padding:12px 24px;border-radius:16px;font:700 clamp(.95rem,3.6vw,1.1rem) Poppins,system-ui,sans-serif;letter-spacing:0}
.btn{--b:var(--color-accent);display:block;width:100%;min-height:56px;border:0;border-radius:20px;padding:12px 16px;font:400 1.3rem var(--font-display);letter-spacing:.02em;color:var(--on);background:var(--b);cursor:pointer;box-shadow:0 6px 0 color-mix(in oklch,var(--b) 55%,black);margin-top:14px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in oklch,var(--b) 55%,black)}
.btn.g{--b:var(--c3)}
.btn[style*="--mut"]{background:var(--card)!important;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding:8px 0}
.path:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;border-radius:9px;background:var(--line)}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);box-shadow:var(--shadow-card);border-radius:24px;padding:10px 16px 10px 10px;color:var(--ink);cursor:pointer;width:82%;text-align:left}
.node:nth-child(odd){align-self:flex-start}.node:nth-child(even){align-self:flex-end}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.done{border-color:var(--c1);box-shadow:0 6px 0 color-mix(in oklch,var(--c1) 60%,black)}
.node:disabled{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.node i{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--on);font:400 1.8rem var(--font-display);font-style:normal;background:var(--c);box-shadow:inset 0 -5px 0 #0003}
.node b{display:block;font-size:1rem;line-height:1.2}
.node small{color:var(--mut);font-size:.84rem}
.st{color:var(--c1);letter-spacing:2px;font-size:1.05rem;text-shadow:0 1px 0 #0004}
.boss{align-self:stretch!important;width:100%!important;justify-content:center;background:var(--c6);color:#fff;border-color:var(--c6);box-shadow:0 6px 0 color-mix(in oklch,var(--c6) 60%,black)}
.boss b{font:400 1.5rem var(--font-display)}
.boss small{color:#fff;opacity:.85}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hud>span{background:var(--card);border:3px solid var(--line);border-radius:var(--radius-pill);padding:2px 14px;font-weight:800;font-size:.95rem}
.hearts{color:var(--c2);font-size:1.3rem!important;letter-spacing:2px}
.area{position:relative;height:min(62vh,470px);border-radius:24px;overflow:hidden;border:3px solid var(--line);box-shadow:var(--shadow-card);background:linear-gradient(var(--sky),var(--card));touch-action:manipulation}
.area:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;pointer-events:none;background:repeating-linear-gradient(135deg,var(--c3) 0 12px,color-mix(in oklch,var(--c3) 70%,black) 12px 24px)}
.drop{position:absolute;top:0;border:0;padding:0;background:none;color:var(--ink);animation:fall 9s linear forwards;cursor:pointer}
@keyframes fall{from{transform:translateY(-90px)}to{transform:translateY(var(--h))}}
.drop span{display:block;background:var(--card);border:3px solid var(--c);border-radius:18px;padding:10px 8px;font:800 .95rem/1.2 var(--font-body);box-shadow:0 5px 0 var(--c)}
.drop span.ok{animation:ok .45s forwards}.drop span.no{animation:no .45s forwards}
@keyframes ok{to{transform:translateY(-50px) scale(1.2);opacity:0;background:var(--okbg)}}
@keyframes no{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}to{transform:scale(.6);opacity:0;background:var(--nobg)}}
.msg{min-height:3.6em;border:3px solid;border-radius:18px;padding:8px 14px;margin-top:14px;font-weight:800;font-size:.95rem;display:flex;align-items:center}
.msg.n{background:var(--nobg);color:var(--no);border-color:var(--no)}.msg.y{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.big{font:400 4rem/1 var(--font-display);text-shadow:0 4px 0 var(--c1)}
.stars{font-size:2.6rem;color:var(--c1);letter-spacing:6px;text-shadow:0 3px 0 #0004;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.ex{display:flex;gap:12px;align-items:center;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px;text-align:left}
.ex:before{content:"✓";flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:800}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.chip{background:var(--okbg);color:var(--ok);border:3px solid var(--ok);border-radius:16px;padding:10px;font-size:.92rem}
.badge{display:inline-grid;place-items:center;width:92px;height:92px;border-radius:50%;color:var(--on);font:400 2.8rem var(--font-display);background:var(--c);box-shadow:inset 0 -7px 0 #0003,0 6px 0 var(--line)}
.badge[style*="--c6"]{color:#fff}
@media (prefers-reduced-motion:reduce){.bird,.stars{animation:none}.drop{animation-duration:14s}}
</style>

function map(){stop();document.querySelector(".top").hidden=false;$("tot").textContent="Skor: "+total();
const all=P.st.slice(0,5).every(x=>x>0);
$("app").innerHTML=`<h2 class="center" style="margin:6px 0 14px">Peta petualangan</h2><div class="path">`+
S.map((x,i)=>{const open=i==0||P.st[i-1]>0;return `<button class="node${P.st[i]?" done":""}" style="--c:var(--c${x.n})" ${open?"":"disabled"} onclick="intro(${i+1})"><i>${x.n}</i><span><b>Sila ke-${x.n}: ${x.s}</b><small>${open?(P.st[i]?`<span class="st">${stars(P.st[i])}</span>`:"Belum dimainkan"):"Selesaikan level sebelumnya"}</small></span></button>`}).join("")+
`<button class="node boss" ${all?"":"disabled"} onclick="intro(6)"><span class="center"><b>Tantangan akhir</b><small>${all?(P.st[5]?`<span class="st">${stars(P.st[5])}</span>`:"Semua sila sekaligus!"):"Selesaikan kelima sila dulu"}</small></span></button></div>`}
function intro(l){const x=S[l-1];
$("app").innerHTML=l<6?`<div class="card center"><span class="badge" style="--c:var(--c${x.n})">${x.n}</span><h2 style="margin:12px 0 6px">Sila ke-${x.n}</h2><p>${x.t}</p>
<p style="color:var(--mut)">Sila ini tentang ${x.h}.</p>
<p><b>Misi:</b> sentuh ketiga perilaku yang sesuai sila ini. Perilaku sila lain dan perilaku buruk akan mengurangi nyawa!</p>
<button class="btn" onclick="play(${l})">Siap!</button><button class="btn" style="background:var(--mut)" onclick="map()">Kembali</button></div>`:
`<div class="card center"><span class="badge" style="--c:var(--c6)">★</span><h2 style="margin:12px 0 6px">Tantangan akhir</h2>
<p><b>Misi:</b> kumpulkan 8 perilaku yang sesuai Pancasila dari sila mana pun. Hindari perilaku yang tidak sesuai!</p>
<button class="btn" onclick="play(6)">Mulai</button><button class="btn" style="background:var(--mut)" onclick="map()">Kembali</button></div>`}
function play(l){
  let pool,goal;
  if(l<6){const x=S[l-1];goal=3;
    const oth=shuf(S.filter(y=>y.n!=l).flatMap(y=>y.ex.map(t=>({t,k:"O",n:y.n})))).slice(0,3);
    pool=[...x.ex.map(t=>({t,k:"T"})),...oth,...shuf(BAD).slice(0,2).map(t=>({t,k:"B"}))];
  }else{goal=8;
    pool=[...S.flatMap(y=>y.ex.map(t=>({t,k:"T"}))),...BAD.map(t=>({t,k:"B"}))];}
  G={l,goal,pool,got:new Set(),hearts:3,score:0,combo:0,q:[],over:false};
  $("app").innerHTML=`<div class="hud"><span>${l<6?"Sila ke-"+l:"Tantangan akhir"}</span><span class="hearts" id="hp"></span><span id="pr"></span></div>
  <div class="area" id="area"></div><div class="msg y" id="msg">Sentuh perilaku yang tepat sebelum jatuh!</div>`;
  hud();spawn();G.tm=setInterval(spawn,1700);
}
function hud(){$("hp").textContent="♥".repeat(G.hearts)+"♡".repeat(3-G.hearts);$("hp").setAttribute("aria-label",G.hearts+" nyawa");$("pr").textContent=G.got.size+"/"+G.goal}
function say(t,c){const m=$("msg");if(m){m.className="msg "+c;m.textContent=t}}
function spawn(){
  if(!G||G.over)return;const a=$("area");if(!a||a.children.length>=5)return;
  if(!G.q.length)G.q=shuf(G.pool.filter(x=>!G.got.has(x.t)));
  const it=G.q.pop();if(!it||G.got.has(it.t)||[...a.children].some(c=>c.dataset.t===it.t))return;
  const b=document.createElement("button"),W=a.clientWidth,w=Math.min(170,W*.46);
  b.className="drop";b.dataset.t=it.t;b.style.width=w+"px";b.style.left=Math.random()*(W-w)+"px";
  b.style.setProperty("--h",a.clientHeight+"px");b.style.setProperty("--c","var(--c"+(1+Math.floor(Math.random()*5))+")");
  b.innerHTML=`<span>${it.t.replace(/\.$/,"")}</span>`;
  b.onpointerdown=()=>tap(b,it);
  b.addEventListener("animationend",e=>{if(e.animationName==="fall")b.remove()});
  a.appendChild(b);
}
function tap(b,it){
  if(G.over||b.dataset.done)return;b.dataset.done=1;b.style.animationPlayState="paused";
  const sp=b.firstChild;
  if(it.k==="T"){G.got.add(it.t);G.combo++;G.score+=10+Math.min(G.combo,5)*2;sp.classList.add("ok");beep(660);
    say(G.combo>2?"Beruntun "+G.combo+"x! Hebat!":"Tepat!","y");}
  else{G.hearts--;G.combo=0;sp.classList.add("no");beep(180);
    say(it.k==="O"?`Itu perilaku sila ke-${it.n}, bukan sila ke-${G.l}.`:"Itu perilaku yang tidak sesuai dengan Pancasila.","n");}
  setTimeout(()=>b.remove(),450);hud();
  if(G.got.size>=G.goal){stop();setTimeout(win,500)}else if(G.hearts<=0){stop();setTimeout(lose,500)}
}
function win(){
  const l=G.l,s=Math.max(1,G.hearts),sc=G.score+G.hearts*20;beep(880);
  P.st[l-1]=Math.max(P.st[l-1],s);P.sc[l-1]=Math.max(P.sc[l-1],sc);$("tot").textContent="Skor: "+total();
  if(l<6){const x=S[l-1];
    $("app").innerHTML=`<div class="card center"><h2>Level selesai!</h2><div class="stars">${stars(s)}</div><div class="big">${sc}</div>
    <p style="color:var(--mut)">Perilaku sila ke-${x.n}: ${x.s}</p>${x.ex.map(e=>`<div class="ex" style="--c:var(--c${x.n})">${e}</div>`).join("")}
    <button class="btn g" onclick="${l<5?`intro(${l+1})`:"map()"}">${l<5?"Level berikutnya":"Ke peta"}</button><button class="btn" onclick="map()" style="background:var(--mut)">Ke peta</button></div>`;
  }else{
    $("app").innerHTML=`<div class="card center"><span class="badge" style="--c:var(--c1);color:#14213D">★</span><h2 style="margin:12px 0 4px">Pahlawan Pancasila!</h2><div class="stars">${stars(s)}</div>
    <p>Skor total kamu: <b>${total()}</b></p><p style="color:var(--mut)">Dengan meneladani Pancasila, kita mendapat manfaat:</p>
    <div class="chips">${MANFAAT.map(m=>`<div class="chip">${m}</div>`).join("")}</div>
    <button class="btn" onclick="map()">Kembali ke peta</button></div>`;}
